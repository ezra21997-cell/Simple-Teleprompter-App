<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teleprompter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       CUSTOM TITLE BAR
  ═══════════════════════════════════════════════════════════ -->
  <div id="titlebar">
    <div id="titlebar-drag">
      <svg class="brand-mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="3" width="10" height="1.6" rx=".8" fill="currentColor"/>
        <rect x="1" y="7.2" width="14" height="1.6" rx=".8" fill="currentColor" opacity=".55"/>
        <rect x="1" y="11.4" width="7" height="1.6" rx=".8" fill="currentColor" opacity=".55"/>
        <circle cx="14" cy="3.8" r="1.6" fill="var(--accent)"/>
      </svg>
      <span id="titlebar-name">Teleprompter</span>
    </div>
    <div id="window-controls">
      <button class="win-btn" id="btn-minimize" title="Minimize" aria-label="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="win-btn" id="btn-maximize" title="Maximize" aria-label="Maximize">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="win-btn" id="btn-close" title="Close" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       EDIT VIEW
  ═══════════════════════════════════════════════════════════ -->
  <div id="edit-view" class="view active">
    <div id="edit-layout">

      <!-- Script pane -->
      <section id="script-area">
        <div id="script-header">
          <label class="pane-title" for="script-input">Script</label>
          <span id="script-meta"></span>
        </div>
        <div
          id="script-input"
          contenteditable="true"
          role="textbox"
          spellcheck="false"
          data-placeholder="Paste or type your script here. Images and formatting from web pages come along too."
        ></div>
      </section>

      <!-- Settings sidebar -->
      <aside id="sidebar">
        <div id="sidebar-scroll">

          <div class="setting">
            <div class="setting-head">
              <label for="speed-slider">Scroll speed</label>
              <span class="value" id="speed-value">50</span>
            </div>
            <input type="range" id="speed-slider" min="1" max="200" value="50" />
          </div>

          <div class="setting">
            <div class="setting-head">
              <label for="fontsize-slider">Text size</label>
              <span class="value" id="fontsize-value">42px</span>
            </div>
            <input type="range" id="fontsize-slider" min="18" max="96" value="42" />
          </div>

          <div class="setting">
            <div class="setting-head"><label for="font-select">Typeface</label></div>
            <div class="select-wrap">
              <select id="font-select">
                <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">System</option>
                <option value="Georgia, 'Times New Roman', serif">Georgia</option>
                <option value="'Courier New', Courier, monospace">Courier</option>
                <option value="Arial, Helvetica, sans-serif">Arial</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
              </select>
            </div>
          </div>

          <div class="divider"></div>

          <div class="setting">
            <label class="switch-row" for="voice-toggle">
              <span class="switch-text">
                <span class="switch-title">Voice Follow</span>
                <span id="voice-hint" class="hint-text visible">Scrolls to match your voice. Works offline after a one-time 40&nbsp;MB download.</span>
              </span>
              <input type="checkbox" id="voice-toggle" class="switch" />
            </label>
          </div>

          <div class="divider"></div>

          <div class="setting">
            <div class="setting-head"><label>Pause / resume key</label></div>
            <div id="key-picker-row">
              <kbd id="key-display" class="key-badge">Space</kbd>
              <button id="key-picker-btn" class="secondary-btn">Change</button>
            </div>
            <p id="key-hint" class="hint-text">Press any key…</p>
          </div>

        </div>

        <div id="start-row">
          <button id="start-btn" class="primary-btn">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>
            Start prompter
          </button>
        </div>
      </aside>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       PROMPTER VIEW
  ═══════════════════════════════════════════════════════════ -->
  <div id="prompter-view" class="view">

    <!-- Reading band at the guide line -->
    <div id="guide-line"></div>
    <div class="guide-arrow" id="arrow-left"></div>
    <div class="guide-arrow" id="arrow-right"></div>
    <div id="edge-fade"></div>

    <!-- Scrolling text -->
    <div id="prompter-scroller">
      <div id="prompter-text"></div>
      <div id="prompter-padding-bottom"></div>
    </div>

    <!-- Top-left back button -->
    <button id="back-btn" class="hud-btn" title="Back to Editor">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2L3.5 6l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Edit
    </button>

    <!-- Top-right HUD overlay -->
    <div id="hud-overlay">
      <div id="hud-controls">
        <button id="play-pause-btn" class="hud-btn" title="Play / Pause">
          <span id="play-icon">&#9646;&#9646;</span>
        </button>
        <div class="hud-control-row">
          <span class="hud-label">Speed</span>
          <input type="range" id="hud-speed" min="1" max="200" value="50" class="hud-range" />
          <span class="hud-value" id="hud-speed-val">50</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-label">Size</span>
          <input type="range" id="hud-fontsize" min="18" max="96" value="42" class="hud-range" />
          <span class="hud-value" id="hud-fontsize-val">42px</span>
        </div>
      </div>
    </div>


    <!-- Voice follow status -->
    <div id="voice-status"></div>

    <!-- Seek scrollbar -->
    <input type="range" id="prompter-seek" min="0" max="1000" value="0"
           orient="vertical" title="Seek" />

    <!-- Progress bar -->
    <div id="progress-bar-track">
      <div id="progress-bar-fill"></div>
    </div>

  </div>

  <script src="node_modules/vosk-browser/dist/vosk.js"></script>
  <script src="voice-follow.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
